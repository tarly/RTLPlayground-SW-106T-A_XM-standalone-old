<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Switch Login</title>
<style>
:root{
  --bg:#f4f6f8;--panel:#ffffff;--bd:#d7dde4;--fg:#1a222c;--fg2:#5c6773;
  --ac:#0969da;--acfg:#ffffff;--bad:#cf222e;
}
:root[data-theme="dark"]{
  --bg:#0e1116;--panel:#161b22;--bd:#2c333c;--fg:#e6edf3;--fg2:#8d96a0;
  --ac:#4c8ef7;--acfg:#ffffff;--bad:#f85149;
}


*{box-sizing:border-box;margin:0}
body{
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--fg);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
}
.card{
  background:var(--panel);border:1px solid var(--bd);border-radius:12px;
  padding:36px 32px;width:min(360px,92vw);
  box-shadow:0 8px 30px rgba(0,0,0,.12);
}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
h1{font-size:19px;font-weight:650}
p.sub{color:var(--fg2);font-size:13px;margin-bottom:24px}
label{display:block;font-size:13px;color:var(--fg2);margin-bottom:6px}
input[type=password],input[type=text]{
  width:100%;padding:10px 12px;font-size:15px;color:var(--fg);
  background:var(--bg);border:1px solid var(--bd);border-radius:8px;outline:none;
}
input[type=password]:focus,input[type=text]:focus{border-color:var(--ac)}
button{
  width:100%;margin-top:18px;padding:10px;font-size:15px;font-weight:600;
  color:var(--acfg);background:var(--ac);border:0;border-radius:8px;cursor:pointer;
}
button:hover{filter:brightness(1.1)}
#err{color:var(--bad);font-size:13px;min-height:20px;margin-top:14px;text-align:center}
</style>
<script>
(function(){
  var pref;
  try{pref=localStorage.getItem("theme")||"auto";}catch(e){pref="auto";}
  if(pref!=="auto"&&pref!=="light"&&pref!=="dark")pref="auto";
  var dark=window.matchMedia("(prefers-color-scheme: dark)").matches;
  var t=pref;
  if(pref==="auto")t=dark?"dark":"light";
  document.documentElement.dataset.theme=t;
})();
</script>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="2">
      <rect x="2" y="7" width="20" height="10" rx="2"/>
      <path d="M6 11v2M10 11v2M14 11v2M18 11v2"/>
    </svg>
    <h1 id="hn">Switch Login</h1>
  </div>
  <p class="sub" id="sub">RTLPlayground management interface</p>
  <form method="post" action="login">
    <label for="user" id="lu">Username</label>
    <input id="user" name="user" type="text" value="admin" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="pwd" id="lp">Password</label>
    <input id="pwd" name="pwd" type="password" autocomplete="current-password" autofocus required
           oninput="document.getElementById('err').textContent=''">
    <button type="submit" id="lb">Sign in</button>
    <div id="err" role="alert" aria-live="polite"></div>
  </form>
</div>
<script>
(function(){
  var L={
    de:["Switch-Anmeldung","RTLPlayground-Verwaltungsoberfläche","Passwort","Anmelden","Falsches Passwort, bitte erneut versuchen.","Benutzername"],
    en:["Switch Login","RTLPlayground management interface","Password","Sign in","Wrong username or password, try again.","Username"],
    ja:["スイッチ ログイン","RTLPlayground 管理インターフェース","パスワード","ログイン","ユーザー名またはパスワードが違います。","ユーザー名"],
    zh:["交换机登录","RTLPlayground 管理界面","密码","登录","用户名或密码错误，请重试。","用户名"],
    es:["Inicio de sesión del switch","Interfaz de gestión de RTLPlayground","Contraseña","Iniciar sesión","Usuario o contraseña incorrectos.","Usuario"],
    fr:["Utilisateur du commutateur","Interface de management RTLPlayground","Mot de passe","Se connecter","Nom d'utilisateur ou mot de passe erroné.","Nom d'utilisateur"]
  };
  var l=null;
  try{l=localStorage.getItem("rtl_lang");}catch(e){}
  if(!L[l])l=(navigator.language||"en").slice(0,2);
  var s=L[l]||L.en;
  // Name the tab after the switch: the hostname seen at the last login here,
  // otherwise the address, so several open switches can be told apart
  var host=null;
  try{host=localStorage.getItem("rtl_host");}catch(e){}
  document.title=(host||location.hostname)+" – "+s[0];
  document.getElementById("hn").textContent=host||s[0];
  document.getElementById("sub").textContent=s[1];
  document.getElementById("lp").textContent=s[2];
  document.getElementById("lu").textContent=s[5];
  document.getElementById("lb").textContent=s[3];
  if(document.referrer.endsWith("login.html"))document.getElementById("err").textContent=s[4];
})();
</script>
</body>
</html>
